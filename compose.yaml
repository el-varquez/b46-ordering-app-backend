name: b46-ordering

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: b46_ordering
      POSTGRES_USER: b46
      POSTGRES_PASSWORD: b46_local_only
    ports:
      - "5433:5432"
    volumes:
      - b46-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b46 -d b46_ordering"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  b46-postgres-data:
